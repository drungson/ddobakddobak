<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>또박또박</title>
<style>
  body{font-family:system-ui,"Malgun Gothic",sans-serif;max-width:640px;margin:0 auto;padding:24px 16px;line-height:1.6;color:#222}
  h1{margin:0 0 4px} .sub{color:#666;margin:0 0 20px}
  button{font-size:18px;padding:14px 20px;border:0;border-radius:12px;background:#2f6fed;color:#fff;cursor:pointer;margin:4px 4px 4px 0}
  button:disabled{background:#aab;cursor:default}
  button.rec{background:#d63a3a}
  button.sec{background:#e8ecf5;color:#223}
  #status{margin:12px 0;color:#445;min-height:1.5em}
  #cands button{display:block;width:100%;text-align:left;font-size:22px;background:#fff;color:#223;border:2px solid #cfd6e6;margin:8px 0}
  #cands button:hover{border-color:#2f6fed}
  #result{font-size:26px;font-weight:600;padding:16px;border-radius:12px;background:#eef3ff;margin-top:12px;min-height:1.5em}
  .note{font-size:13px;color:#777;margin-top:24px}
</style>
</head>
<body>
<h1>또박또박</h1>
<p class="sub">말씀하시면 가능성이 높은 문장 3개를 보여 드려요. 맞는 것을 눌러 선택하세요.</p>

<button id="load">1. 모델 불러오기</button>
<button id="rec" disabled>2. 말하기 시작</button>
<div id="status">먼저 '모델 불러오기'를 눌러 주세요. 처음에는 파일을 내려받느라 시간이 걸려요.</div>

<div id="cands"></div>
<div id="result" hidden></div>
<div id="after" hidden>
  <button id="speak" class="sec">소리로 듣기</button>
  <button id="again" class="sec">다시 말하기</button>
</div>

<p class="note">녹음한 목소리는 서버로 전송되지 않고 이 기기의 브라우저 안에서만 처리됩니다.</p>

<script type="module">
import { AutoProcessor, AutoTokenizer, WhisperForConditionalGeneration, env }
  from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.0";

const MODEL_ID = "drungson/whisper";   // 예: "내아이디/ddobak-whisper"
env.allowLocalModels = false;

const $ = id => document.getElementById(id);
const status = t => $("status").textContent = t;
let processor, tokenizer, model, recorder, chunks = [], stream, timer;

$("load").onclick = async () => {
  if (!MODEL_ID) { status("index.html의 MODEL_ID가 비어 있어요."); return; }
  $("load").disabled = true;
  status("모델을 내려받는 중... (처음 한 번만 오래 걸려요)");
  try {
    const cb = p => {
      if (p.status === "progress" && p.total)
        status("내려받는 중: " + p.file.split("/").pop() + " " + Math.round(p.loaded / p.total * 100) + "%");
    };
    processor = await AutoProcessor.from_pretrained(MODEL_ID);
    tokenizer = await AutoTokenizer.from_pretrained(MODEL_ID);
    model = await WhisperForConditionalGeneration.from_pretrained(MODEL_ID, {
      dtype: { encoder_model: "q8", decoder_model_merged: "q8" },
      progress_callback: cb
    });
    status("준비 완료! '말하기 시작'을 눌러 주세요.");
    $("rec").disabled = false;
  } catch (e) {
    console.error(e);
    status("모델을 불러오지 못했어요: " + e.message);
    $("load").disabled = false;
  }
};

function reset() {
  $("cands").innerHTML = ""; $("result").hidden = true; $("after").hidden = true;
}

$("rec").onclick = async () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    console.error(e);
    status("마이크를 사용할 수 없어요: " + e.name + " (주소창의 마이크 권한을 확인해 주세요)");
    return;
  }
  reset();
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = async () => {
    clearTimeout(timer);
    stream.getTracks().forEach(t => t.stop());
    $("rec").textContent = "2. 말하기 시작"; $("rec").classList.remove("rec");
    $("rec").disabled = true;
    status("후보 문장을 만드는 중...");
    try {
      const buf = await new Blob(chunks).arrayBuffer();
      const ctx = new AudioContext({ sampleRate: 16000 });
      const audio = await ctx.decodeAudioData(buf);
      const inputs = await processor(audio.getChannelData(0));
      const base = { inputs: inputs.input_features, language: "korean", task: "transcribe", max_new_tokens: 64 };
      const seen = new Set();
      const add = o => tokenizer.batch_decode(o, { skip_special_tokens: true })
                        .map(t => t.trim()).filter(Boolean).forEach(t => seen.add(t));
      add(await model.generate(base));
      for (let i = 0; i < 2 && seen.size < 3; i++) {
        status("후보 문장을 만드는 중... (" + (i + 2) + "/3)");
        add(await model.generate({ ...base, do_sample: true, temperature: 0.8, top_k: 20 }));
      }
      const texts = [...seen].slice(0, 3);
      if (!texts.length) { status("인식된 말이 없어요. 다시 말해 주세요."); }
      else {
        status("맞는 문장을 눌러 주세요. 없으면 '다시 말하기'를 누르세요.");
        texts.forEach(t => {
          const b = document.createElement("button");
          b.textContent = t;
          b.onclick = () => choose(t);
          $("cands").appendChild(b);
        });
        $("after").hidden = false;
        $("speak").hidden = true;
      }
    } catch (e) {
      console.error(e);
      status("변환하지 못했어요: " + e.message);
    }
    $("rec").disabled = false;
  };
  recorder.start();
  $("rec").textContent = "말하기 끝내기"; $("rec").classList.add("rec");
  status("듣고 있어요... (최대 15초)");
  timer = setTimeout(() => recorder.state === "recording" && recorder.stop(), 15000);
};

function choose(t) {
  $("cands").innerHTML = "";
  $("result").textContent = t; $("result").hidden = false;
  $("speak").hidden = false; $("after").hidden = false;
  status("선택한 문장이에요.");
}

$("speak").onclick = () => {
  const t = $("result").textContent.trim(); if (!t) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = "ko-KR";
  speechSynthesis.speak(u);
};
$("again").onclick = () => { reset(); status("'말하기 시작'을 눌러 다시 말해 주세요."); };
</script>
</body>
</html>
